name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      # OpenCV's non-headless wheel needs these system libs to import on the
      # headless CI runner.
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # Pyflakes-level checks only: undefined names, syntax errors, bad
      # comparisons — real bugs, not style. Keeps CI signal high without
      # churning the existing code over formatting.
      - name: Lint (real errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run unit tests
        run: python -m unittest discover -p "test_*.py" -v
